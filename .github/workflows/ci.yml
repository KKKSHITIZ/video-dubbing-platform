name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VideoDubbingPlatform.sln

      - name: Build
        run: dotnet build VideoDubbingPlatform.sln --no-restore -c Debug

      - name: Test
        run: dotnet test VideoDubbingPlatform.sln --no-build -c Debug
